# Paid resources: review the dashboard estimate before applying this Blueprint.
services:
  - type: web
    name: sportmarket
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/categories
    numInstances: 1
    disk:
      name: sportmarket-images
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: IMAGE_STORAGE_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sportmarket-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sportmarket-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sportmarket-db
          property: password
databases:
  - name: sportmarket-db
    plan: 0.1c-256mb
    region: ohio
    databaseName: sportmarket
    user: sportmarket_app
    postgresMajorVersion: "18"
    diskSizeGB: 1
    ipAllowList: []
