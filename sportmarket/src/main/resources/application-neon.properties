# Local opt-in profile: npm run backend:neon adapts the ignored Neon env file.
# Application requests use the pooled endpoint; migrations use a direct connection.
spring.flyway.url=${DB_MIGRATION_URL}
spring.flyway.user=${DB_MIGRATION_USERNAME}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
