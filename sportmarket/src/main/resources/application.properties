spring.application.name=sportmarket
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportmarket}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Base64-encoded random key, at least 32 decoded bytes. No development fallback.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:sportmarket}
# Comma-separated exact origins; empty disables cross-origin browser access.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Avoid DevTools enabling verbose web logging of validation exceptions/input.
spring.devtools.add-properties=false

# Validation exceptions can contain rejected input at DEBUG; keep web/security
# logs at INFO and never log SQL bind values containing password hashes.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Enum request values must use names (e.g. SOLD), never numeric ordinals.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true


# Files live outside source control by default. Use an absolute directory in deployment.
app.images.directory=${IMAGE_STORAGE_DIR:${user.home}/.sportmarket/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=6MB
