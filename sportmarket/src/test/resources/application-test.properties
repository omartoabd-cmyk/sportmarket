spring.datasource.url=jdbc:h2:mem:sportmarket;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Ephemeral test-only key: two random hex strings form valid Base64 (48 decoded bytes).
app.jwt.secret=${random.value}${random.value}
app.jwt.issuer=sportmarket-test
app.cors.allowed-origins=http://localhost:5173

app.images.directory=${java.io.tmpdir}/sportmarket-test-images-${random.uuid}
